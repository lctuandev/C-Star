# What the PWA needs from a host (ADR-002, FEAT-001 known issues).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html html;
    text/plain txt;
    text/css css;
    text/javascript js;
    application/json json;
    application/manifest+json webmanifest;
    image/png png;
    image/svg+xml svg;
    image/webp webp;
    model/gltf-binary glb;
    font/woff2 woff2;
  }

  gzip on;
  gzip_types text/css text/javascript application/json application/manifest+json image/svg+xml model/gltf-binary;
  gzip_min_length 1024;

  # `/about` is about.html: the worker precaches pages under these addresses.
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # A browser must always be able to see a new worker.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Content-hashed: never changes under the same name.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
